# Publishes the project website to https://elitekid.github.io/popout-authenticator/
# (site/ at the root, the code-share receiving page under /share/, store images under /img/)
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store/screenshots/**'
      - 'store/brand/**'
      - 'public/_locales/**'
      - 'share-page/**'
      - 'src/core/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:share
      - run: mkdir -p _site/share _site/img && cp -R site/. _site/ && cp -R dist-share/. _site/share/ && cp -R store/screenshots/. _site/img/ && cp store/brand/logo-300x300.png _site/img/logo.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
