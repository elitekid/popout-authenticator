# Publishes the code-share receiving page to https://elitekid.github.io/popout-authenticator/share/
name: Share page

on:
  push:
    branches: [main]
    paths:
      - 'share-page/**'
      - 'src/core/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:share
      - run: mkdir -p _site/share && cp -R dist-share/. _site/share/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}share/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
