<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Popout Authenticator</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #656d76;
        --border: #d0d7de;
        --accent: #1a73e8;
        --error: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1d21;
          --fg: #e6e8eb;
          --muted: #9aa0a6;
          --border: #3a3d42;
          --accent: #8ab4f8;
          --error: #ff8a80;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        width: min(92vw, 360px);
        padding: 24px 0;
        text-align: center;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 16px;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .error {
        color: var(--error);
        font-size: 14px;
      }
      .code {
        display: block;
        width: 100%;
        margin: 12px 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        font: 600 36px/1.2 ui-monospace, monospace;
        letter-spacing: 2px;
        cursor: pointer;
      }
      input,
      button.submit {
        box-sizing: border-box;
        width: 100%;
        margin: 6px 0;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      button.submit {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
